services:
  postgres:
    image: postgres:16
    container_name: lab19-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: questlog

    ports:
      - "5433:5432"

    volumes:
      - lab19-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d questlog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lab19-postgres-data: {}