services:
  postgres:
    image: postgres:16
    container_name: node_backend_questlog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog
    ports:
      - "5433:5432"
    volumes:
      - questlog_postgres_data:/var/lib/postgresql/data

volumes:
  questlog_postgres_data: