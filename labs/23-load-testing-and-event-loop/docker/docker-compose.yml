services:
  postgres:
    image: postgres:16
    container_name: node_backend_questlog_postgres_lab23

    environment:
      POSTGRES_USER: questlog
      POSTGRES_PASSWORD: questlog
      POSTGRES_DB: questlog

    ports:
      - "5437:5432"

    volumes:
      - lab23-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlog -d questlog"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: node_backend_questlog_prometheus_lab23

    ports:
      - "9091:9090"

    extra_hosts:
      - "host.docker.internal=host-gateway"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - lab23-prometheus-data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

volumes:
  lab23-postgres-data: {}
  lab23-prometheus-data: {}